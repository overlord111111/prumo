[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prumo"
version = "0.3.0"
description = "O prumo do agente: diagnóstico, playbooks e verificação para engenharia reversa de jogos com agentes de IA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Over", email = "overlord111111@users.noreply.github.com" }]
keywords = ["reverse-engineering", "game-hacking", "mcp", "agents", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Disassemblers",
]
dependencies = []

[project.optional-dependencies]
map = ["dnfile>=0.18"]
dev = ["pytest>=8", "ruff>=0.6", "dnfile>=0.18"]

[project.scripts]
prumo = "prumo.cli:main"

[project.urls]
Homepage = "https://github.com/overlord111111/prumo"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prumo = ["data/*.json", "data/*/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
